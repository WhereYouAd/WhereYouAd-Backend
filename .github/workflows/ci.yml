name: Java CI with Gradle

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # CI 서버 내부에서 테스트용 DB/Redis 컨테이너 실행
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: where_you_ad
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
        # CI용, 환경변수로 DB 설정
        env:
          DB_URL: jdbc:mysql://localhost:3306/where_you_ad?serverTimezone=Asia/Seoul
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test_password
          JWT_SECRET: dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItY2ktdGVzdC1wdXJwb3Nlcw==
          SMS_API_KEY: test_api_key
          SMS_SECRET_KEY: test_secret_key
          SMS_SENDER_NUMBER: 01000000000
          OPENAI_API_KEY: test_openai_key
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          AES_SECRET: test_aes_key
          GOOGLE_ADS_CLIENT_ID: test_google_client_id
          GOOGLE_ADS_CLIENT_SECRET: test_google_client_secret
          GOOGLE_ADS_OAUTH2_REDIRECT_URL: http://localhost:8080/api/google/callback
          GOOGLE_ADS_DEVELOPER_TOKEN: test_google_developer_token
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: test_google_ads_login_customer_id
          GOOGLE_ADS_FRONTEND_CALLBACK_URL: http://localhost:5173/oauth2/google/result
          NAVER_CLIENT_ID: test_naver_client_id
          NAVER_CLIENT_SECRET: test_naver_client_secret
          KAKAO_CLIENT_ID: test_kakao_client_id
          KAKAO_CLIENT_SECRET: test_kakao_client_secret
          OAUTH2_REDIRECT_URL: http://localhost:3000/oauth2/redirect
          BASE_URL: http://localhost:8080
          META_APP_ID: test_meta_app_id
          META_APP_SECRET: test_meta_app_secret
          META_REDIRECT_URI: http://localhost:8080/api/meta/callback
          META_FRONTEND_CALLBACK_URL: http://localhost:5173/oauth2/meta/result
          AWS_ACCESS_KEY: test_aws_access_key
          AWS_SECRET_KEY: test_aws_secret_key
          KAFKA_HOST_IP: localhost
          COOKIE_SECURE: false
          COOKIE_DOMAIN: localhost
          COOKIE_SAME_SITE: Lax