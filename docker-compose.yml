version: '3.8'

services:
  # 1. Spring Boot App
  app:
    image: ${DOCKER_USERNAME}/where-you-ad-backend:latest
    container_name: where-you-ad-backend
    ports:
      - "8080:8080"  # Public EC2가 이 포트로 트래픽을 보냄
    environment:
      # .env 파일의 변수명을 그대로 매핑
      # 왼쪽: 스프링부트가 아는 이름 / 오른쪽: .env
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # Redis
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}

      # 기타 설정 (.env 그대로 통과)
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH2_REDIRECT_URL: ${OAUTH2_REDIRECT_URL}
      BASE_URL: ${BASE_URL}

      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY}
      SMS_SENDER_NUMBER: ${SMS_SENDER_NUMBER}

      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}

      OPENAI_API_KEY: ${OPENAI_API_KEY}

    depends_on:
      - mysqldb
      - redis
    networks:
      - where-you-ad-network
    restart: always

  # 2. MySQL
  mysqldb:
    image: mysql:8.0
    container_name: where-you-ad-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: whereyouad
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - where-you-ad-network
    restart: always
    ports:
      - "3306:3306"

  # 3. Redis
  redis:
    image: redis:latest
    container_name: where-you-ad-redis
    networks:
      - where-you-ad-network
    restart: always
    ports:
      - "6379:6379"

networks:
  where-you-ad-network:
    driver: bridge