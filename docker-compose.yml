version: '3.8'

services:
  # MySQL
  db:
    image: mysql:8.0
    container_name: where-you-ad-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: where_you_ad
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - where-you-ad-network

  # Redis:
  redis:
    image: redis:latest
    container_name: where-you-ad-redis
    ports:
      - "6379:6379"
    networks:
      - where-you-ad-network

  # Kafka Placeholder: 추후 활성화 예정
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:latest
  #   environment:
