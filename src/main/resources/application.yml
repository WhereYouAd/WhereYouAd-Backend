server:
  port: 8080

spring:
  application:
    name: WhereYouAd
    # 서버 기본 주소
    base-url: ${BASE_URL:http://localhost:8080}
    # 프론트엔드 기본 주소 (이메일 내 링크 등에 사용)
    frontend-url: ${FRONTEND_URL:http://localhost:3000}

  # 1. 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}           # 예: jdbc:mysql://localhost:3306/whereyouad
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 2. JPA 설정 (Hibernate)
  jackson:
    time-zone: Asia/Seoul
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update       # 테이블 자동 업데이트 (데이터 유지)
    show-sql: true           # 실행 SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true     # SQL 예쁘게 출력
        generate_statistics: true  # Actuator/Micrometer hibernate 지표(N+1 검증용) 수집을 위해 필요
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false     #OSIV 비활성화 -> SSE Db 커넥션 풀 고갈 방지

  # 3. Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # 4. 이메일 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} #이메일 앱 비밀번호 입력
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # 5. 소셜 로그인(OAuth2) 설정
  security:
    oauth2:
      client:
        registration:
          # 네이버
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
          # 구글
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
          # 카카오
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  # kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: where-you-ad-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      observation-enabled: true    # @KafkaListener 처리시간/에러 지표(spring.kafka.listener.*)
    template:
      observation-enabled: true    # KafkaTemplate.send() 지표(spring.kafka.template.*)

  # AWS S3
  cloud:
    # Spring Boot 3.5.x + Spring Cloud 2024.0.x 호환 검증 비활성화
    compatibility-verifier:
      enabled: false
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      s3:
        bucket: whereyouad-s3
      region:
        static: ap-northeast-2

# 6. JWT 및 AES 설정
jwt:
  secret: ${JWT_SECRET}

aes:
  secret: ${AES_SECRET}
#  expiration: 86400000

# 7. OAuth2 로그인 성공 후 프론트엔드 리다이렉트 URL
oauth2:
  redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:3000/oauth2/redirect}

# 8. SMS 인증
coolSms:
  apiKey: ${SMS_API_KEY}
  secretKey: ${SMS_SECRET_KEY}
  senderNumber: ${SMS_SENDER_NUMBER}

# 9. OpenAI 설정
openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com
  model: gpt-5.6-terra

# 10. Feign 클라이언트 로그 설정
feign:
  client:
    config:
      openAiClient:
        loggerLevel: BASIC   # NONE / BASIC / HEADERS / FULL
      metaClient:
        loggerLevel: BASIC
        connectTimeout: 5000
        readTimeout: 10000

# 11. Meta Marketing API 설정
meta:
  ad:
    app-id: ${META_APP_ID}
    app-secret: ${META_APP_SECRET}
    redirect-uri: ${META_REDIRECT_URI}
    frontend-callback-url: ${META_FRONTEND_CALLBACK_URL}
    graph-api-version: v25.0


# 11. Google Ads API
google:
  ads:
    client-id: ${GOOGLE_ADS_CLIENT_ID}
    client-secret: ${GOOGLE_ADS_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_ADS_OAUTH2_REDIRECT_URL}
    developer-token: ${GOOGLE_ADS_DEVELOPER_TOKEN}
    login-customer-id: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:}
    frontend-callback-url: ${GOOGLE_ADS_FRONTEND_CALLBACK_URL}

# 12. 로깅 설정
logging:
  level:
    org.apache.kafka: WARN

# 11. 인증 쿠키 설정 (로컬/운영 환경 분리)
cookie:
  secure: ${COOKIE_SECURE:false}
  domain: ${COOKIE_DOMAIN:}
  same-site: ${COOKIE_SAME_SITE:Lax}

# 13. 클릭 이상 감지 설정
click:
  surge:
    enabled: true
    notify-enabled: true        # false = 감지·기록만 하고 발송하지 않는 드라이런 모드
    window-minutes: 5
    multiplier-threshold: 3.0   # baseline 대비 배수 기준
    z-score-threshold: 3.5
    min-window-clicks: 30       # 윈도우 최소 절대 클릭수 가드
    cold-start-min-clicks: 90   # baseline 전무 시 절대치 단독 발동 기준
    streak-required: 2          # 연속 감지 횟수 (2회 = 10분 지속)
    cooldown-seconds: 1800      # 광고별 알림 쿨다운(초)
    ema-alpha: 0.2
    warmup-min-samples: 12      # EMA 샘플 미만이면 직전 1시간 롤링 baseline 사용
    active-set-ttl-seconds: 1800
  bot-summary:
    enabled: true


# 14. 모니터링 설정
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics,env,loggers # 수집할 정보들
  metrics:
    tags:
      application: whereyouad
    distribution:
      percentiles-histogram:
        http.server.requests: true   # p95/p99 latency 계산용 histogram bucket 생성
    enable:
      hibernate: true                # N+1 검증용 hibernate.* 지표 활성화
  endpoint:
    health:
      show-details: always