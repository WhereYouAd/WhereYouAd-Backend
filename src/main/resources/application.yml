server:
  port: 8080

spring:
  application:
    name: WhereYouAd
    # 서버 기본 주소
    base-url: ${BASE_URL:http://localhost:8080}

  # 1. 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}           # 예: jdbc:mysql://localhost:3306/whereyouad
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 2. JPA 설정 (Hibernate)
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update       # 테이블 자동 업데이트 (데이터 유지)
    show-sql: true           # 실행 SQL 콘솔 출력
    properties:
      hibernate:
        format_sql: true     # SQL 예쁘게 출력
    open-in-view: false     #OSIV 비활성화 -> SSE Db 커넥션 풀 고갈 방지

  # 3. Redis 설정
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # 4. 이메일 설정 (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} #이메일 앱 비밀번호 입력
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # 5. 소셜 로그인(OAuth2) 설정
  security:
    oauth2:
      client:
        registration:
          # 네이버
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
          # 구글
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
          # 카카오
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  # kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: where-you-ad-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # AWS S3
  cloud:
    # Spring Boot 3.5.x + Spring Cloud 2024.0.x 호환 검증 비활성화
    compatibility-verifier:
      enabled: false
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      s3:
        bucket: whereyouad-s3
      region:
        static: ap-northeast-2

# 6. JWT 및 AES 설정
jwt:
  secret: ${JWT_SECRET}

aes:
  secret: ${AES_SECRET}
#  expiration: 86400000

# 7. OAuth2 로그인 성공 후 프론트엔드 리다이렉트 URL
oauth2:
  redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:3000/oauth2/redirect}

# 8. SMS 인증
coolSms:
  apiKey: ${SMS_API_KEY}
  secretKey: ${SMS_SECRET_KEY}
  senderNumber: ${SMS_SENDER_NUMBER}

# 9. OpenAI 설정
openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com
  model: gpt-4o-mini

# 10. Feign 클라이언트 로그 설정
feign:
  client:
    config:
      openAiClient:
        loggerLevel: BASIC   # NONE / BASIC / HEADERS / FULL
      metaClient:
        loggerLevel: BASIC
        connectTimeout: 5000
        readTimeout: 10000

# 11. Meta Marketing API 설정
meta:
  ad:
    app-id: ${META_APP_ID}
    app-secret: ${META_APP_SECRET}
    redirect-uri: ${META_REDIRECT_URI}
    graph-api-version: v25.0
